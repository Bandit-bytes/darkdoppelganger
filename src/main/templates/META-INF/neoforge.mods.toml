modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL="https://github.com/Bandit-bytes/darkdoppelganger/issues"
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL="https://pixeldreamstudios.net/"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "irons_spellbooks"
type = "required"
versionRange = "[1.21.1-3.15.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "geckolib"
type = "required"
versionRange = "[4.7.5.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "playeranimator"
type = "required"
versionRange = "[2.0.1+1.21.1,)"
ordering = "NONE"
side = "BOTH"

# AzureLib is optional; its 3.1 API is used only by the client armor bridge.
[[dependencies."${mod_id}"]]
modId = "azurelib"
type = "optional"
versionRange = "[3.1.0,4.0.0)"
ordering = "AFTER"
side = "CLIENT"
